name: cross-platform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust stable with rustfmt and clippy
        shell: bash # fails on the first error on every OS (pwsh checks only the last command)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      # yeslogic-fontconfig-sys (Slint's font discovery) links fontconfig through
      # pkg-config at build time. Wayland, X11, xkbcommon and EGL are loaded at
      # run time, and bundled SQLite needs only the preinstalled C compiler.
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev

      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # Dead code differs by feature set: the production build has no
      # benchmark fixture, the fixture build has no R4 harness.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features benchmark-fixture -- -D warnings
      - run: cargo build --release --locked
