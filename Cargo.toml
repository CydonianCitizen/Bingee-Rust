[package]
name = "bingee-desktop"
version = "0.1.0"
edition = "2024"

[features]
# The R4 benchmark fixture (1,000 fake titles, spike database, synthetic
# posters), started with `--benchmark-fixture`. Never in a default build.
benchmark-fixture = []
# The opt-in R4 latency harness (`--r4-latency`, ADR-0004).
r4-measurement = ["benchmark-fixture"]

[dependencies]
# "functions": the Unicode case-folding SQL function used by library search.
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
slint = "1.17.1"

[build-dependencies]
slint-build = "1.17.1"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
